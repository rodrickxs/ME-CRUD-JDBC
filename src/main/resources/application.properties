spring.application.name=hotel-reservas
server.port=8080

# Conexão MySQL (pode ser trocada por variáveis de ambiente DB_URL, DB_USER, DB_PASSWORD)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/hotel_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}

# Executa schema.sql ao iniciar (cria as tabelas se ainda não existirem)
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
